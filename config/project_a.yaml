# Project A — all assumptions in one place.
# Change numbers here, never inside the code.
# (In the interview they will change assumptions live — this file is where.)

paths:
  raw_dir: data/raw/m5
  processed_dir: data/processed
  output_dir: outputs/project_a

scope:
  state: CA
  stores: [CA_1, CA_2, CA_3, CA_4]
  category: FOODS
  departments: [FOODS_1, FOODS_2, FOODS_3]

time:
  default_cutoff: 1885        # last training day; overridden by --cutoff
  test_days: 56               # days replayed after the cutoff
  forecast_horizon: 28        # days ahead per forecast
  backtest_cutoffs: [1773, 1801, 1829, 1857]   # all before 1885, 28 days apart

lead_times:
  supplier_to_dc:             # lognormal, mean in days, coefficient of variation
    FOODS_1: {mean: 5,  cv: 0.4}
    FOODS_2: {mean: 7,  cv: 0.4}
    FOODS_3: {mean: 10, cv: 0.4}
  dc_to_store_days: 2

review:
  store_orders: daily
  dc_order_weekday: Monday

costs:
  holding_rate_per_year: 0.25       # x selling price, per unit per year
  lost_sale_rate: 0.35              # x selling price, per unit lost
  po_cost_per_department: 50.0      # $ per purchase order per department
  transfer_cost_per_unit: 0.05      # $ per unit DC -> store

capacity:
  dc_outbound_multiplier: 1.25      # x avg daily CA FOODS sales, last 365 training days
  dc_outbound_lookback_days: 365
  store_max_days_of_sales: 21

starting_stock:
  days_of_avg_sales: 7              # at every location, including the DC

service:
  target_fill_rate: 0.95

stress_test:
  department: FOODS_3
  lead_time_multiplier: 2.0
  duration_days: 21
  start_offset_days: 14             # days after test start when the disruption begins
  warning_days: 14

simulation:
  n_seeds: 20
  random_seed: 42
  # one lognormal lead-time draw per purchase order (one PO = one department
  # shipment). "line" = one draw per item line instead.
  lead_time_sampling: po
  # holding cost is charged on DC stock, store stock and DC->store in transit
  # (all owned by us). Supplier->DC pipeline is the supplier's until it lands.

demand_recovery:
  # A zero-sales run is flagged as a stockout when, given how often this item
  # sells on the days around the run, a run this long would happen by chance
  # with probability below alpha.
  stockout_alpha: 0.01
  # A "low" day: sales <= this share of the series' median daily sales.
  # Slow sellers (median < 10/day) -> only exact zeros count.
  low_sales_fraction: 0.10
  neighbour_window_days: 56     # days before and after a run used to judge it
  # Runs longer than this are treated as "dormant" (item probably not really
  # on the shelf / phantom listing): demand set to 0, not to the old rate.
  max_stockout_days: 56
  # A day is a store closure when the store's total sales fall below this
  # share of its 28-day rolling median (finds Christmas Day every year).
  closure_threshold: 0.10
  # Store-level disruption found in the data (CA_2 sales share fell from
  # ~16.5% to ~13% of CA, then rose to ~19% after). Dates are inclusive.
  store_disruptions:
    - {store: CA_2, start: "2014-10-04", end: "2015-05-26"}
  # How many days before the cutoff are used for "recent" bias numbers.
  recent_days: 365
  injection_test_samples: 3000
